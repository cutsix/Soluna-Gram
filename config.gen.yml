# API Credentials of your telegram application created at https://my.telegram.org/apps
api_id: "ID_HERE"
api_hash: "HASH_HERE"
qrcode_login: "False"
web_login: "False"

# Either debug logging is enabled or not
debug: "False"
error_report: "True"

# Admin interface related
web_interface:
  enable: "False"
  secret_key: "RANDOM_STRING_HERE"
  host: "127.0.0.1"
  port: "3333"
  origins: ["*"]

# Locale settings
application_language: "zh-cn"
application_region: "China"
application_tts: "zh-CN"
timezone: "Asia/ShangHai"

# In-Chat logging settings, default settings logs directly into Kat, strongly advised to change
log: "False"
# chat id of the log group, such as -1001234567890, also can use username, such as "telegram"
log_chatid: "me"

# Disabled Built-in Commands
disabled_cmd:
  - example1
  - example2

# Google search preferences
result_length: "5"

# TopCloud image output preferences
width: "1920"
height: "1080"
background: "#101010"
margin: "20"

# socks5 or http or MTProto
proxy_addr: ""
proxy_port: ""
http_addr: ""
http_port: ""
mtp_addr: ""
mtp_port: ""
mtp_secret: ""

# Apt Git source
git_source: ""
git_ssh: ""

# Update Notice
update_check: "False"
update_time: "86400"
update_username: ""
update_delete: "True"

# ipv6
ipv6: "False"

# Analytics
allow_analytic: "True"
sentry_api: ""
mixpanel_api: ""

# Speed_test cli path
speed_test_path: ""

# Time format https://www.runoob.com/python/att-time-strftime.html
# 24 default
time_form: "%H:%M"
date_form: "%A %y/%m/%d"
# only support %m %d %H %M %S
start_form: "%m/%d %H:%M"

# Silent to reduce editing times
silent: "True"

# Eval use pb or not
use_pb: "True"
